[workspace]
name = "see-through-burrito"
version = "0.1.0"
description = "Elixir anime illustration decomposition with GPU"
authors = ["K. S. Ernest (iFire) Lee <ernest.lee@chibifire.com>"]
channels = ["nvidia", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
# CUDA Toolkit with headers and development files
cuda-toolkit = "12.4.*"
cudnn = "9.*"
nccl = "2.*"
# Build tools
c-compiler = "*"
cxx-compiler = "*"
make = "*"
pkg-config = "*"